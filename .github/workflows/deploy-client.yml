name: Deploy client

# The server is deployed by the deploy-server job in ci.yml, after CI passes.
on:
  push:
    branches: [main]
    paths:
      - client/**
      - packages/rules/**
      - packages/protocol/**
      - package-lock.json
      - .github/workflows/deploy-client.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version from commit
        run: echo "VITE_APP_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test -w @palikka/rules -w @palikka/protocol -w @palikka/client
      - run: npm run build -w @palikka/client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Version file for the production smoke
        run: echo "{\"version\":\"${GITHUB_SHA::7}\"}" > client/dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
